[workspace]
resolver = "2"
members = [
    "crates/lgtm-core",
    "crates/lgtm-gui",
    "crates/lgtm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mizzion-work/lgtm"
description = "from wtf to lgtm — a cross-platform diff/merge tool"

[workspace.dependencies]
# Diff engine
similar = "2.6"

# CLI
clap = { version = "4.5", features = ["derive"] }

# File / directory walking
ignore = "0.4"

# Detection
content_inspector = "0.2"
chardetng = "0.1"
encoding_rs = "0.8"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"

# Syntax highlighting (integration point only in v1)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Internal crates
lgtm-core = { path = "crates/lgtm-core", version = "0.1.0" }
lgtm-gui  = { path = "crates/lgtm-gui",  version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
