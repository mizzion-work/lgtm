[workspace]
resolver = "2"
members = [
    "crates/lgtm-core",
    "crates/lgtm-gui",
    "crates/lgtm-cli",
    # crates/lgtm-gui-gpui — excluded from the default workspace build
    # because gpui's transitive deps don't currently resolve cleanly
    # outside zed's own workspace (core-foundation =0.10.0 vs cocoa
    # 0.26.0's req of ^0.10 → 0.10.1 conflict). Sources are kept under
    # `crates/lgtm-gui-gpui/` as the migration scaffold; see that
    # crate's README for the path to a working build.
]
exclude = ["crates/lgtm-gui-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mizzion-work/lgtm"
description = "from wtf to lgtm — a cross-platform diff/merge tool"

[workspace.dependencies]
# Diff engine
similar = "3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# File / directory walking
ignore = "0.4"

# Detection
content_inspector = "0.2"
chardetng = "1"
encoding_rs = "0.8"

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# GUI
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Git operations (blame). Vendored libgit2 so end users don't need a system one.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Date / time arithmetic for blame display
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Regex for "find" mode (opt-in via the .* toggle)
regex = "1"

# Native file dialogs (menubar "Open Files..." / "Open Folder...")
rfd = "0.17"

# gpui — Zed's GPU-accelerated UI framework. Pulled from the Zed monorepo
# because the crates.io publish of gpui depends on gpui_platform which
# isn't published separately. Only consumed by the excluded lgtm-gui-gpui
# crate (see workspace.exclude above); this entry exists so the
# scaffolded crate's manifest stays valid for human readers.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "e25458243bb5f3522fd56c12d16d145e44395053", default-features = false, features = ["x11", "wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "e25458243bb5f3522fd56c12d16d145e44395053" }

# Internal crates
lgtm-core = { path = "crates/lgtm-core", version = "0.1.0" }
lgtm-gui  = { path = "crates/lgtm-gui",  version = "0.1.0" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
